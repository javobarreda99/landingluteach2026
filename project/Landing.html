<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luteach — Aprende de quienes ya dominan tu curso</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="ui_kits/kit.css">
<link rel="icon" href="assets/luteach-icon.jpg">
<style>
  /* ── Landing palette refresh ──────────────────────────────────────
     Replaces the warm sand/cream neutrals with a clean white + cool-grey
     system for a more professional, B2B feel. Brand orange + dark hero
     are untouched. Scoped to this page via :root override (loads last). */
  :root {
    --paper:    #FFFFFF;   /* cards / primary surface */
    --canvas:   #FFFFFF;   /* page background — pure white */
    --canvas-2: #F5F6F8;   /* alt section background — light cool grey */
    --sand-100: #EFF1F4;   /* subtle fill / hover row */
    --sand-200: #E5E7EC;   /* hairline borders */
    --sand-300: #D3D7DF;   /* stronger borders / dividers */

    /* Neutralize the warm taupe text ramp → cool, crisp greys */
    --ink-900: #1B2230;
    --ink-700: #353D4B;
    --ink-600: #464E5C;
    --ink-500: #636B79;
    --ink-400: #8A909C;
    --ink-300: #BFC4CD;

    /* Neutral, cooler shadows to match */
    --shadow-xs: 0 1px 2px rgba(20, 27, 43, 0.06);
    --shadow-sm: 0 2px 6px rgba(20, 27, 43, 0.07);
    --shadow-md: 0 8px 20px rgba(20, 27, 43, 0.09);
    --shadow-lg: 0 18px 40px rgba(20, 27, 43, 0.11);
  }
  html { scroll-behavior: smooth; }
  .nav-links a { white-space: nowrap; }
  .course-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--orange-300); }
  image-slot { display:block; }
  /* Hamburger hidden on desktop, shown when nav-links collapse */
  .nav-hamburger { display: none; }
  @media (max-width: 960px) { .nav-links { display:none !important; } .nav-hamburger { display: flex !important; } }

  /* ═══════════════════════════════════════
     RESPONSIVE — MOBILE (≤ 768px)
  ═══════════════════════════════════════ */
  @media (max-width: 768px) {

    /* ── Nav: always show dark bar so logo + CTA are always visible ── */
    header { background: rgba(16, 20, 32, 0.97) !important; backdrop-filter: saturate(180%) blur(12px) !important; border-bottom: 1px solid rgba(255,255,255,.10) !important; }
    header .btn-ghost { display: none !important; }
    header .lt-wrap   { gap: 10px !important; }

    /* ── General ── */
    .lt-wrap { padding-left: 20px !important; padding-right: 20px !important; }
    section  { padding-top: 64px !important; padding-bottom: 64px !important; }

    /* ── Typography ── */
    .lt-display { font-size: 30px !important; line-height: 1.1 !important; }
    .lt-h1      { font-size: 24px !important; }
    .lt-h2      { font-size: 20px !important; }
    #como h2    { font-size: 26px !important; }
    footer h2   { font-size: 28px !important; }

    /* ── Hero ── */
    .hero-grid  { grid-template-columns: 1fr !important; padding: 32px 20px 40px !important; gap: 24px !important; }
    .hero-grid .badge { white-space: normal !important; font-size: 11px !important; }
    .hero-visual { height: 260px !important; }
    .hero-visual > div:first-child img { height: 200px !important; }
    /* Chips: restore absolute positioning, bring inside container (was incorrectly set to relative) */
    .hero-visual > div:last-child { position: absolute !important; left: 8px !important; bottom: 8px !important; right: 8px !important; top: auto !important; }
    .hero-visual > div:last-child .card { padding: 8px 10px !important; gap: 8px !important; }
    .hero-visual > div:last-child .card div { font-size: 11px !important; }

    /* ── Impact Band ── */
    .impact-grid { grid-template-columns: 1fr 1fr !important; }
    .impact-grid > div { border-right: none !important; padding: 20px 16px !important; border-bottom: 1px solid rgba(255,255,255,.08) !important; }
    .impact-grid > div:nth-child(3), .impact-grid > div:nth-child(4) { border-bottom: none !important; }

    /* ── Benefits ── */
    .benefits-grid { grid-template-columns: 1fr 1fr !important; gap: 12px !important; }

    /* ── Desafios ── */
    .desafios-header { grid-template-columns: 1fr !important; gap: 24px !important; margin-bottom: 40px !important; }
    .desafios-stats  { grid-template-columns: 1fr 1fr !important; border-top: 1px solid rgba(255,255,255,.1) !important; }
    /* Remove all inline borders; add clean separators via CSS */
    .desafios-stats > div { padding: 22px 14px !important; border-right: none !important; border-bottom: 1px solid rgba(255,255,255,.06) !important; }
    .desafios-stats > div:nth-child(3), .desafios-stats > div:nth-child(4) { border-bottom: none !important; }
    /* Reduce the huge 54px stat numbers so they fit in ~160px cells */
    .desafios-stats > div > div:nth-child(2) { font-size: 34px !important; letter-spacing: -0.02em !important; margin-bottom: 8px !important; }

    /* ── El Puente cards ── */
    .elpuente-cards { grid-template-columns: 1fr !important; }
    .elpuente-connector { flex-direction: row !important; padding: 14px 0 !important; justify-content: center !important; }
    .elpuente-connector i[data-lucide="arrow-right"] { transform: rotate(90deg) !important; }
    .elpuente-connector i[data-lucide="arrow-left"]  { transform: rotate(-90deg) !important; }
    .elpuente-connector span { writing-mode: horizontal-tb !important; }

    /* ── Casos de impacto ── */
    .casos-grid { grid-template-columns: 1fr !important; }

    /* ── ODS ── */
    .ods-header { grid-template-columns: 1fr !important; gap: 20px !important; margin-bottom: 36px !important; }
    .ods-goals  { grid-template-columns: 1fr 1fr !important; }
    .ods-bottom { grid-template-columns: 1fr !important; padding: 24px 20px !important; gap: 12px !important; }

    /* ── Quiénes son ── */
    .quienes-grid   { grid-template-columns: 1fr !important; gap: 32px !important; }
    .quienes-traits { grid-template-columns: 1fr !important; }
    /* Keep the verificado badge inside the container */
    .quienes-grid > div:last-child > .card { right: 8px !important; }

    /* ── Steps ── */
    .step-grid { grid-template-columns: 1fr !important; padding: 32px 22px !important; gap: 28px !important; }

    /* ── Cursos ── */
    .cursos-grid { grid-template-columns: 1fr !important; }

    /* ── Testimonials ── */
    .testimonials-grid { grid-template-columns: 1fr !important; }

    /* ── Partner logos: smaller cards that still scroll ── */
    .partner-card { width: 150px !important; min-height: 96px !important; padding: 14px 16px !important; }
    .partner-card img { max-height: 56px !important; }

    /* ── Footer / CTA ── */
    footer .lt-wrap { padding-top: 52px !important; padding-bottom: 40px !important; text-align: center !important; }
    footer .lt-wrap > div[style*="gap: 14"] { justify-content: center !important; }
    .footer-cols   { grid-template-columns: 1fr 1fr !important; gap: 24px !important; }
    .footer-bottom { flex-direction: column !important; gap: 6px !important; text-align: center !important; align-items: center !important; }

  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="landing/image-slot.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="landing/Hero.jsx"></script>
<script type="text/babel" src="landing/Impact.jsx"></script>
<script type="text/babel" src="landing/Sections.jsx"></script>
<script type="text/babel">
function App() {
  useLucide();
  const scrollTo = (id) => {
    if (id === 'top') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    const el = document.getElementById(id);
    if (el) window.scrollTo({ top: el.offsetTop - 64, behavior: 'smooth' });
  };
  return (
    <div className="page">
      <Nav onScrollTo={scrollTo} />
      <Hero onScrollTo={scrollTo} />
      <ImpactBand />
      <Partners />
      <Desafios />
      <ElPuente />
      <CasosImpacto />
      <Benefits />
      <Steps />
      <Cursos />
      <QuienesSon />
      <Luteachers />
      <Testimonials />
      <ODS />
      <FinalCTA />
      <LFooter onScrollTo={scrollTo} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
