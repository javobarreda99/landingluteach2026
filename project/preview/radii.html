<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--paper);padding:24px;color:var(--ink-900)}
  .row{display:flex;gap:16px;align-items:flex-end}
  .col{text-align:center}
  .box{background:var(--grad-brand-soft);border:1px solid var(--sand-300)}
  .lbl{font:var(--code);font-size:11px;color:var(--ink-500);margin-top:8px}
  .px{font:var(--caption);color:var(--ink-900);font-weight:700}
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="width:60px;height:60px;border-radius:var(--r-xs)"></div><div class="px">xs</div><div class="lbl">6px</div></div>
    <div class="col"><div class="box" style="width:60px;height:60px;border-radius:var(--r-sm)"></div><div class="px">sm</div><div class="lbl">10px</div></div>
    <div class="col"><div class="box" style="width:60px;height:60px;border-radius:var(--r-md)"></div><div class="px">md</div><div class="lbl">14px</div></div>
    <div class="col"><div class="box" style="width:60px;height:60px;border-radius:var(--r-lg)"></div><div class="px">lg</div><div class="lbl">20px</div></div>
    <div class="col"><div class="box" style="width:60px;height:60px;border-radius:var(--r-xl)"></div><div class="px">xl</div><div class="lbl">28px</div></div>
    <div class="col"><div class="box" style="width:90px;height:60px;border-radius:var(--r-pill)"></div><div class="px">pill</div><div class="lbl">999px</div></div>
  </div>
</body></html>
