<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--canvas);padding:30px 24px;color:var(--ink-900);display:flex;gap:22px;justify-content:center}
  .col{text-align:center}
  .box{width:92px;height:62px;border-radius:var(--r-md);background:var(--paper)}
  .lbl{font:var(--code);font-size:11px;color:var(--ink-500);margin-top:12px}
  .nm{font:var(--caption);color:var(--ink-900);font-weight:700;margin-top:10px}
</style></head>
<body>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="nm">xs</div><div class="lbl">subtle</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="nm">sm</div><div class="lbl">cards</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="nm">md</div><div class="lbl">hover</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="nm">lg</div><div class="lbl">modals</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-orange);background:var(--orange-500)"></div><div class="nm">orange</div><div class="lbl">CTA glow</div></div>
</body></html>
