<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--paper);padding:22px;color:var(--ink-900)}
  .row{display:flex;gap:12px;align-items:stretch}
  .sw{flex:1;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--sand-200)}
  .chip{height:70px}
  .meta{padding:8px 10px}
  .name{font:var(--caption);color:var(--ink-900);font-weight:700}
  .hex{font:var(--code);color:var(--ink-500);font-size:11px}
  .div{width:1px;background:var(--sand-200);margin:0 4px}
  .tag{font:var(--overline);letter-spacing:.12em;text-transform:uppercase;font-size:10px;color:var(--ink-400);margin:0 4px 8px}
</style></head>
<body>
  <div style="display:flex;gap:18px">
    <div style="flex:3">
      <div class="tag">Naranja — primario</div>
      <div class="row">
        <div class="sw"><div class="chip" style="background:var(--orange-600)"></div><div class="meta"><div class="name">orange-600</div><div class="hex">#F35D06</div></div></div>
        <div class="sw"><div class="chip" style="background:var(--orange-500)"></div><div class="meta"><div class="name">orange-500 ★</div><div class="hex">#F28705</div></div></div>
        <div class="sw"><div class="chip" style="background:var(--orange-400)"></div><div class="meta"><div class="name">orange-400</div><div class="hex">#F8A01C</div></div></div>
        <div class="sw"><div class="chip" style="background:var(--orange-300)"></div><div class="meta"><div class="name">orange-300</div><div class="hex">#FBC56B</div></div></div>
      </div>
    </div>
    <div style="flex:1.5">
      <div class="tag" style="color:var(--blue-600)">Azul — complemento</div>
      <div class="row">
        <div class="sw"><div class="chip" style="background:var(--blue-600)"></div><div class="meta"><div class="name">blue-600</div><div class="hex">#1A5E97</div></div></div>
        <div class="sw"><div class="chip" style="background:var(--blue-500)"></div><div class="meta"><div class="name">blue-500</div><div class="hex">#2480C2</div></div></div>
      </div>
    </div>
  </div>
</body></html>
