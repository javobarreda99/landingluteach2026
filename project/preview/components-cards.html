<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--canvas);padding:22px;color:var(--ink-900);display:flex;gap:16px}
  .card{flex:1;background:var(--paper);border:1px solid var(--sand-200);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:18px}
  .tile{width:46px;height:46px;border-radius:var(--r-md);box-shadow:var(--shadow-sm);margin-bottom:12px}
  h3{font:var(--h4);margin:0 0 4px}
  p{font:var(--body-sm);color:var(--ink-500);margin:0}
  .hov{box-shadow:var(--shadow-md);transform:translateY(-2px)}
  .foot{display:flex;align-items:center;gap:7px;margin-top:14px;padding-top:12px;border-top:1px solid var(--sand-100);font:var(--caption);color:var(--ink-400)}
  .ava{width:24px;height:24px;border-radius:50%;background:var(--grad-brand)}
</style></head>
<body>
  <div class="card"><div class="tile" style="background:var(--cat-code)"></div><h3>Intro to Python</h3><p>Build fundamentals with a vetted CS Luteacher.</p><div class="foot"><span class="ava"></span>Mara · TU Delft</div></div>
  <div class="card hov"><div class="tile" style="background:var(--cat-math)"></div><h3>Calculus I</h3><p>Hover state — lifts to shadow-md.</p><div class="foot"><span class="ava"></span>Diego · UPC</div></div>
</body></html>
