<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--paper);padding:24px;color:var(--ink-900)}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  .bar{height:18px;background:var(--grad-brand-soft);border-radius:var(--r-xs)}
  .t{font:var(--code);font-size:11px;color:var(--ink-900);font-weight:600;width:34px}
  .px{font:var(--code);font-size:11px;color:var(--ink-400)}
</style></head>
<body>
  <div class="row"><span class="t">1</span><span class="bar" style="width:4px"></span><span class="px">4px</span></div>
  <div class="row"><span class="t">2</span><span class="bar" style="width:8px"></span><span class="px">8px</span></div>
  <div class="row"><span class="t">3</span><span class="bar" style="width:12px"></span><span class="px">12px</span></div>
  <div class="row"><span class="t">4</span><span class="bar" style="width:16px"></span><span class="px">16px</span></div>
  <div class="row"><span class="t">6</span><span class="bar" style="width:24px"></span><span class="px">24px</span></div>
  <div class="row"><span class="t">8</span><span class="bar" style="width:32px"></span><span class="px">32px</span></div>
  <div class="row"><span class="t">12</span><span class="bar" style="width:48px"></span><span class="px">48px</span></div>
  <div class="row"><span class="t">16</span><span class="bar" style="width:64px"></span><span class="px">64px · 4px base scale</span></div>
</body></html>
