<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--paper);padding:22px;color:var(--ink-900);display:flex;gap:16px;justify-content:center}
  .it{text-align:center}
  .it img{width:80px;height:80px;border-radius:var(--r-lg);box-shadow:var(--shadow-md);display:block}
  .cap{font:var(--caption);color:var(--ink-700);font-weight:700;margin-top:10px}
  .hex{font:var(--code);font-size:10.5px;color:var(--ink-400);margin-top:3px}
</style></head>
<body>
  <div class="it"><img src="../assets/course-icon-programming-2.png" alt="Programación"><div class="cap">Programación</div><div class="hex">#5CBDE7 → #324E60</div></div>
  <div class="it"><img src="../assets/course-icon-math.png" alt="Matemáticas"><div class="cap">Matemáticas</div><div class="hex">#FCC714 → #F39107</div></div>
  <div class="it"><img src="../assets/course-icon-physics.png" alt="Física"><div class="cap">Física</div><div class="hex">#03DBBE → #00B3E3</div></div>
  <div class="it"><img src="../assets/course-icon-chemistry.png" alt="Química"><div class="cap">Química</div><div class="hex">#58EA39 → #E4CB16</div></div>
  <div class="it"><img src="../assets/course-icon-english.png" alt="Inglés"><div class="cap">Inglés</div><div class="hex">#418EEB → #EA5380</div></div>
</body></html>
