<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--paper);padding:22px;color:var(--ink-900);display:flex;gap:20px;align-items:center}
  .item{text-align:center}
  .item img{width:104px;height:104px;border-radius:var(--r-xl);box-shadow:var(--shadow-md);display:block}
  .cap{font:var(--caption);color:var(--ink-500);margin-top:10px}
  .txt{flex:1}
  .txt h3{font:var(--h4);margin:0 0 6px}
  .txt p{font:var(--body-sm);color:var(--ink-500);margin:0}
</style></head>
<body>
  <div class="item"><img src="../assets/luteach-icon.jpg" alt="App icon"><div class="cap">App / profile icon</div></div>
  <div class="item"><img src="../assets/course-icon-programming.png" alt="Programming course icon"><div class="cap">Course tile · Programming</div></div>
  <div class="txt"><h3>The mascot</h3><p>The walking student with a backpack is the hero mark — momentum + learning. White knockout on the warm orange gradient. Treat as a logo asset; don't redraw or recolor.</p></div>
</body></html>
