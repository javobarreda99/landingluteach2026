<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--paper);padding:22px;color:var(--ink-900);display:flex;gap:18px}
  .fam{flex:1;border:1px solid var(--sand-200);border-radius:var(--r-md);padding:16px 18px}
  .glyph{font-size:46px;line-height:1;color:var(--ink-900)}
  .fname{font:var(--h4);margin:12px 0 2px}
  .frole{font:var(--caption);color:var(--ink-500)}
  .wts{font:var(--code);font-size:11px;color:var(--ink-400);margin-top:8px}
</style></head>
<body>
  <div class="fam"><div class="glyph" style="font-family:var(--font-display);font-weight:800">Aa</div><div class="fname" style="font-family:var(--font-display)">Poppins</div><div class="frole">Display · headings</div><div class="wts">400 · 500 · 600 · 700 · 800</div></div>
  <div class="fam"><div class="glyph" style="font-family:var(--font-body);font-weight:700">Aa</div><div class="fname" style="font-family:var(--font-body)">Nunito Sans</div><div class="frole">Body · UI</div><div class="wts">400 · 500 · 600 · 700 · 800</div></div>
  <div class="fam"><div class="glyph" style="font-family:var(--font-mono);font-weight:500">Aa</div><div class="fname" style="font-family:var(--font-mono)">JetBrains Mono</div><div class="frole">Code surfaces</div><div class="wts">400 · 500 · 600</div></div>
</body></html>
