<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--paper);padding:22px;color:var(--ink-900)}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--sand-200)}
  .chip{height:64px}
  .meta{padding:8px 10px}
  .name{font:var(--caption);color:var(--ink-900);font-weight:700}
  .hex{font:var(--code);color:var(--ink-500);font-size:12px}
  .grad{height:30px;border-radius:var(--r-sm);margin-top:12px;display:flex;align-items:center;padding:0 12px;font:var(--caption);font-weight:800;color:#fff}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--blue-700)"></div><div class="meta"><div class="name">blue-700</div><div class="hex">#134C7E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-600)"></div><div class="meta"><div class="name">blue-600</div><div class="hex">#1A5E97</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-500)"></div><div class="meta"><div class="name">blue-500 ★</div><div class="hex">#2480C2</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-400)"></div><div class="meta"><div class="name">blue-400</div><div class="hex">#4FA3DE</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-300)"></div><div class="meta"><div class="name">blue-300</div><div class="hex">#9CCBEC</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-100)"></div><div class="meta"><div class="name">blue-100</div><div class="hex">#E4F1FA</div></div></div>
  </div>
  <div class="grad" style="background:var(--grad-trust)">--grad-trust · trust blue · #1A5E97 → #2480C2</div>
</body></html>
