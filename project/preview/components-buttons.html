<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--paper);padding:24px;color:var(--ink-900)}
  .grid{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .btn{font-family:var(--font-display);font-weight:600;font-size:15px;border:none;cursor:pointer;border-radius:var(--r-pill);padding:12px 22px;display:inline-flex;align-items:center;gap:8px}
  .primary{background:var(--orange-500);color:#fff;box-shadow:var(--shadow-orange)}
  .primary.hover{background:var(--orange-600)}
  .secondary{background:var(--orange-100);color:var(--orange-700)}
  .ghost{background:transparent;color:var(--ink-700);box-shadow:inset 0 0 0 1.5px var(--sand-300)}
  .dark{background:var(--ink-900);color:#fff}
  .disabled{background:var(--sand-200);color:var(--ink-300);box-shadow:none;cursor:not-allowed}
  .lbl{width:100%;font:var(--caption);color:var(--ink-400);margin:4px 0 -4px}
</style></head>
<body>
  <div class="grid">
    <button class="btn primary">Find a Luteacher</button>
    <button class="btn primary hover">Hover</button>
    <button class="btn secondary">Book a demo</button>
    <button class="btn ghost">Learn more</button>
    <button class="btn dark">Sign in</button>
    <button class="btn disabled">Disabled</button>
  </div>
</body></html>
