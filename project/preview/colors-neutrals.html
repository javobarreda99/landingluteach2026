<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--paper);padding:22px;color:var(--ink-900)}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--sand-200)}
  .chip{height:74px}
  .meta{padding:8px 10px}
  .name{font:var(--caption);color:var(--ink-900);font-weight:700}
  .hex{font:var(--code);color:var(--ink-500);font-size:12px}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="meta"><div class="name">ink-900</div><div class="hex">#2B2520</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="meta"><div class="name">ink-500</div><div class="hex">#6B5D50</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-400)"></div><div class="meta"><div class="name">ink-400</div><div class="hex">#9A8C7D</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-300)"></div><div class="meta"><div class="name">sand-300</div><div class="hex">#E5D5C2</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-100)"></div><div class="meta"><div class="name">sand-100</div><div class="hex">#F7ECDF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--canvas-2)"></div><div class="meta"><div class="name">canvas-2</div><div class="hex">#FDF4EA</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--canvas);box-shadow:inset 0 0 0 1px var(--sand-200)"></div><div class="meta"><div class="name">canvas</div><div class="hex">#FFF9F3</div></div></div>
  </div>
</body></html>
