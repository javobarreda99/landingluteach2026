<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luteach — El tutor correcto, asignado por afinidad</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../kit.css">
<link rel="icon" href="../../assets/luteach-icon.jpg">
<style>
  .site-scroll { height: 100vh; overflow-y: auto; }
  .nav-links a { white-space: nowrap; }
  @media (max-width: 860px){ .nav-links{ display:none !important; } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Sections.jsx"></script>
<script type="text/babel" src="Pricing.jsx"></script>
<script type="text/babel">
function App() {
  useLucide();
  const [demo, setDemo] = React.useState(false);
  const scrollRef = React.useRef(null);
  const scrollTo = (id) => {
    const root = scrollRef.current;
    if (id === 'top') { root.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    const el = document.getElementById(id);
    if (el && root) root.scrollTo({ top: el.offsetTop - 60, behavior: 'smooth' });
  };
  return (
    <div className="site-scroll" ref={scrollRef}>
      <NavBar onDemo={() => setDemo(true)} onScrollTo={scrollTo} />
      <Hero onDemo={() => setDemo(true)} onScrollTo={scrollTo} />
      <LogoStrip />
      <HowItWorks />
      <Vetting />
      <Subjects />
      <Pricing onDemo={() => setDemo(true)} />
      <CTA onDemo={() => setDemo(true)} />
      <Footer onScrollTo={scrollTo} />
      <DemoModal open={demo} onClose={() => setDemo(false)} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
